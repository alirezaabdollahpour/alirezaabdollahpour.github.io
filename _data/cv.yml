- title: Research Summary
  type: list
  contents:
    - I am drawn to the <strong>mathematical foundations of deep learning</strong> &mdash; why neural networks fail under adversarial perturbations and distribution shift, and what principled algorithms follow.
    - My research spans <strong>robustness</strong>, <strong>generalization</strong>, and <strong>post-training methods</strong> (model merging, model editing) for foundation models, with recent work on the <strong>optimal-transport geometry</strong> of adversarial training and <strong>distributionally robust optimization</strong>.
    - I aim to derive rigorous guarantees and translate them into deployable algorithms, with work appearing at <strong>NeurIPS</strong>, <strong>ICML</strong>, and <strong>ICLR</strong>.

